<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS99Vault | #1 PS99 Fair Gaming Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #121214; color: #ffffff; font-family: 'Inter', sans-serif; }
    .glass-card { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glow-orange { box-shadow: 0 0 20px rgba(255, 107, 0, 0.35); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden custom-scrollbar">

  <!-- Top Navigation Header -->
  <header class="h-16 border-b border-zinc-800 bg-zinc-950/80 backdrop-blur-md px-4 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 font-black text-xl tracking-wider cursor-pointer">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-orange-600 to-amber-400 flex items-center justify-center text-white shadow-lg shadow-orange-500/20">
          <i class="fa-solid fa-vault"></i>
        </div>
        <span>PS99<span class="text-orange-500">VAULT</span></span>
      </div>
    </div>

    <!-- Center Stats / Global Info -->
    <div class="hidden md:flex items-center gap-6 text-xs font-semibold text-zinc-400">
      <div class="flex items-center gap-2 bg-zinc-900/80 px-3 py-1.5 rounded-lg border border-zinc-800">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>PROVABLY FAIR</span>
      </div>
      <div class="flex items-center gap-2 bg-zinc-900/80 px-3 py-1.5 rounded-lg border border-zinc-800">
        <i class="fa-solid fa-gem text-cyan-400"></i>
        <span>INSTANT TRADES</span>
      </div>
    </div>

    <!-- Right Side Actions & Profile -->
    <div class="flex items-center gap-3">
      <!-- Roblox Connect Button -->
      <button onclick="toggleModal('robloxLoginModal', true)" class="flex items-center gap-2 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 px-3 py-2 rounded-xl text-xs font-bold transition">
        <i class="fa-solid fa-user-shield text-orange-500"></i>
        <span id="headerUsername">Connect Roblox</span>
      </button>

      <!-- Wallet Button -->
      <button onclick="toggleModal('walletModal', true)" class="flex items-center gap-2 bg-gradient-to-r from-orange-600 to-amber-500 hover:from-orange-500 hover:to-amber-400 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-lg shadow-orange-600/20 transition">
        <i class="fa-solid fa-wallet"></i>
        <span>Wallet</span>
      </button>

      <!-- Balance Badge -->
      <div class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 px-3 py-2 rounded-xl text-xs font-bold">
        <i class="fa-solid fa-gem text-cyan-400"></i>
        <span id="userGemBalance">0</span>
      </div>
    </div>
